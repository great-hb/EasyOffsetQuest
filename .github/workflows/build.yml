name: Build QMOD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test, build, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation packages
        run: python -m pip install -r requirements-ci.txt

      - name: Validate MBF manifest and versions
        id: manifest
        run: python tools/validate_manifest.py

      - name: Select Android NDK r27c
        run: |
          sdkmanager --install 'ndk;27.2.12479018'
          printf '%s\n' "$ANDROID_HOME/ndk/27.2.12479018" > ndkpath.txt

      # Same QPM restore action used by Quest-BSML and custom-types.
      - name: Restore pinned QPM dependencies
        uses: Fernthedev/qpm-action@476c7ba32d6a817b215151ba61cba3fd0e697359 # v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          qpm_version: 'version@1.5.11'
          restore: true
          cache: true
          resolve_ndk: false

      - name: Restore tinyxml2 link library if needed
        run: |
          if [ ! -f extern/libs/libtinyxml2.so ]; then
            curl --fail --location --retry 3 \
              'https://github.com/MillzyDev/NDK-tinyxml2/releases/download/v10.0.0/libtinyxml2.so' \
              --output extern/libs/libtinyxml2.so
          fi

      - name: Test offset math and PC profiles
        run: python tools/test_core.py

      - name: Build ARM64 Release library
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$(cat ndkpath.txt)/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4

      - name: Package and check QMOD
        env:
          MOD_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          python tools/package.py
          python tools/validate_manifest.py --qmod dist/EasyOffsetQuest.qmod
          cp dist/EasyOffsetQuest.qmod "dist/EasyOffsetQuest-${MOD_VERSION}.qmod"
          cd dist
          sha256sum "EasyOffsetQuest-${MOD_VERSION}.qmod" BUILD-INFO.json > SHA256SUMS.txt

      - name: Upload installable QMOD and build report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EasyOffsetQuest-${{ steps.manifest.outputs.version }}-${{ github.sha }}
          path: |
            dist/EasyOffsetQuest-${{ steps.manifest.outputs.version }}.qmod
            dist/BUILD-INFO.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true

      - name: Create draft for MBF testing before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Easy Offset Quest $RELEASE_TAG" --generate-notes \
            release/*.qmod release/BUILD-INFO.json release/SHA256SUMS.txt
